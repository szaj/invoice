# Plesk Docker — Compose (ADR-017 alternate host)
# Plesk nginx owns ports 80/443 and TLS. Do not run Caddy on this host.
# Copy env.example to env and fill in production values before starting.
#
#   cp env.example env
#   docker compose up -d --build

name: invoices-plesk

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner-web
    restart: unless-stopped
    ports:
      # Localhost only — Plesk reverse-proxies this port (Docker Proxy Rules or nginx).
      - "127.0.0.1:3000:3000"
    env_file:
      - env
    environment:
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - internal

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner-worker
    restart: unless-stopped
    env_file:
      - env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
